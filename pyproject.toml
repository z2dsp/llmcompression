[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-text-compression-demo"
version = "0.1.0"
description = "Lossless text compression using a small language model and arithmetic coding"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.5.1",
    "transformers==4.46.3",
    "huggingface-hub==0.26.2",
    "numpy==2.1.3",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
sweep = ["matplotlib>=3.9,<4"]
mesh = ["meshcore==2.3.19"]
wikipedia = ["pyarrow==23.0.1"]
reddit = ["duckdb>=1.4,<3", "mistune>=3,<4"]

[project.scripts]
llm-compress = "llm_compression.cli:main"
llm-mesh = "llm_compression.meshcore_app:main"
llm-mesh-gui = "llm_compression.meshcore_app:gui_main"
mesh-extract = "llm_compression.corpus:main"
mesh-train = "llm_compression.bit_training:main"
nn-train = "llm_compression.nn_training:main"
nn-visualize = "llm_compression.nn_visualizer:main"
nn-generate = "llm_compression.nn_generation:main"
t9-train = "llm_compression.t9_training:main"
text-to-t9 = "llm_compression.t9:encode_main"
t9-predict = "llm_compression.t9:predict_main"
t9-visualize = "llm_compression.t9_visualizer:main"
mcu-sweep = "llm_compression.bit_sweep:main"
mcu-compress = "llm_compression.bit_codec:main"
append-dailydialog = "llm_compression.dailydialog:main"
prepare-wikipedia = "llm_compression.wikipedia:main"

[tool.setuptools.packages.find]
include = ["llm_compression*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: downloads and runs a real Hugging Face model (opt in with RUN_MODEL_TESTS=1)"]
