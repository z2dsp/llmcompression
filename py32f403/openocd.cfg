# Generic Cortex-M4 access. The STM32F1 flash driver is NOT compatible with PY32.
source [find interface/stlink.cfg]
transport select hla_swd
source [find target/swj-dp.tcl]
swj_newdap py32 cpu -expected-id 0x2ba01477
dap create py32.dap -chain-position py32.cpu
target create py32.cpu cortex_m -dap py32.dap -work-area-phys 0x20002000 -work-area-size 0x1000 -work-area-backup 0
adapter speed 1000
gdb_port disabled
tcl_port disabled
telnet_port disabled
